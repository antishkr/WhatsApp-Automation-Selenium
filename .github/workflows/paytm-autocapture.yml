name: Android build
on:
  push:
    branches: [autocapture-android-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir -p autocapture
          tar -xJf paytm-autocapture-src.tar.xz -C autocapture
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fix Java record accessors
        run: |
          perl -pi -e 's/\b(e|current)\.(id|posted|title|body|state|tries|detail|error|key)\b/$1.$2()/g' autocapture/app/src/main/java/com/autocapture/paytm/MainActivity.java autocapture/app/src/main/java/com/autocapture/paytm/CaptureAccessibilityService.java
      - name: Test
        working-directory: autocapture
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble APK
        working-directory: autocapture
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paytm-autocapture-debug-apk
          path: autocapture/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
